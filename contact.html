<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Geode</title>
    <meta name="description" content="Request a Citation Gap Audit from Geode. Find out what AI systems say about your organization and where the gaps are.">
    <meta property="og:title" content="Contact | Geode">
    <meta property="og:description" content="Request a Citation Gap Audit. Find out what AI says about your organization.">
    <meta property="og:type" content="website">
    <link rel="canonical" href="https://geode.digital/contact">
    <link rel="alternate" hreflang="pt-BR" href="https://geode.digital/pt/contato">
    <link rel="alternate" hreflang="en" href="https://geode.digital/contact">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="content">

    <nav>
        <div class="container">
            <a href="/" class="logo">geode<span>.</span></a>
            <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')">&#9776;</button>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/methodology">Methodology</a>
                <a href="/contact" class="active">Contact</a>
                <a href="/pt/contato" style="font-size: 11px; letter-spacing: 1px;">PT</a>
                <button class="mode-toggle" onclick="toggleMode()" title="Toggle light/dark mode" aria-label="Toggle light/dark mode">&#9789;</button>
            </div>
        </div>
    </nav>

    <div class="hero" style="padding-bottom: 60px;">
        <div class="container container--narrow">
            <h1>Let's <span>talk.</span></h1>
            <p class="sub">Tell us about your organization. We'll run an initial citation check and get back to you with what we find.</p>
        </div>
    </div>

    <div class="page-section" style="padding-top: 0;">
        <div class="container container--narrow">
            <form id="contact-form" onsubmit="return submitForm(event)">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="company">Company</label>
                    <input type="text" id="company" name="company" required>
                </div>
                <div class="form-group">
                    <label for="industry">Industry</label>
                    <input type="text" id="industry" name="industry" placeholder="e.g. Engineering, Legal, Manufacturing">
                </div>
                <div class="form-group">
                    <label for="message">What does your organization do?</label>
                    <textarea id="message" name="message" placeholder="Brief description of your expertise and what you're known for."></textarea>
                </div>
                <button type="submit" class="btn btn-primary" id="submit-btn">Request Citation Audit</button>
                <p id="form-status" style="margin-top: 16px; font-size: 13px; display: none;"></p>
            </form>
        </div>
    </div>

    <footer>
        <div class="container">
            <div class="copy">&copy; 2026 Geode | An <a href="https://echology.io">echology</a> company</div>
            <div class="footer-links">
                <a href="/methodology">Methodology</a>
                <a href="/contact">Contact</a>
                <a href="/pt/">Portugu&ecirc;s</a>
            </div>
        </div>
    </footer>

</div>

<script>
function toggleMode() {
    document.body.classList.toggle('light');
    localStorage.setItem('mode', document.body.classList.contains('light') ? 'light' : 'dark');
}
if (localStorage.getItem('mode') === 'light') document.body.classList.add('light');

var LEADS_API = 'https://ops.echology.io/api/leads/inbound';

function submitForm(e) {
    e.preventDefault();
    var btn = document.getElementById('submit-btn');
    var status = document.getElementById('form-status');
    btn.disabled = true;
    btn.textContent = 'Sending...';
    status.style.display = 'none';

    var data = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        company: document.getElementById('company').value,
        industry: document.getElementById('industry').value,
        message: document.getElementById('message').value,
        source: 'geode.digital'
    };

    fetch(LEADS_API, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    })
    .then(function(r) {
        if (!r.ok) throw new Error('Server error');
        return r.json();
    })
    .then(function() {
        status.textContent = 'Received. We will be in touch.';
        status.style.color = 'var(--accent)';
        status.style.display = 'block';
        document.getElementById('contact-form').reset();
    })
    .catch(function() {
        status.innerHTML = 'Could not reach our server. Email us directly at <a href="mailto:kyle@geode.digital">kyle@geode.digital</a>';
        status.style.color = 'var(--amber)';
        status.style.display = 'block';
    })
    .finally(function() {
        btn.disabled = false;
        btn.textContent = 'Request Citation Audit';
    });

    return false;
}
</script>

</body>
</html>
