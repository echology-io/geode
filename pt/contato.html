<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Geode</title>
    <meta name="description" content="Solicite uma Auditoria de Cita&ccedil;&atilde;o da Geode. Descubra o que sistemas de IA dizem sobre sua organiza&ccedil;&atilde;o e onde est&atilde;o as lacunas.">
    <meta property="og:title" content="Contato | Geode">
    <meta property="og:description" content="Solicite uma Auditoria de Cita&ccedil;&atilde;o. Descubra o que a IA diz sobre sua organiza&ccedil;&atilde;o.">
    <meta property="og:type" content="website">
    <link rel="canonical" href="https://geode.digital/pt/contato">
    <link rel="alternate" hreflang="en" href="https://geode.digital/contact">
    <link rel="alternate" hreflang="pt-BR" href="https://geode.digital/pt/contato">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="../style.css">
</head>
<body>

<div id="content">

    <nav>
        <div class="container">
            <a href="/pt/" class="logo"><svg width="20" height="20" viewBox="0 0 160 160" fill="none" style="vertical-align: -3px; margin-right: 6px;"><polygon points="80,12 132,40 132,108 80,136 28,108 28,40" stroke="#8b6cc7" stroke-width="7" fill="none"/><polygon points="80,12 132,40 108,64 62,52" fill="#c4aee8" opacity="0.35"/><polygon points="132,40 132,108 108,64" fill="#8b6cc7" opacity="0.2"/><line x1="62" y1="52" x2="108" y2="64" stroke="#d4c0f0" stroke-width="2.5" opacity="0.5"/><circle cx="62" cy="52" r="3.5" fill="#e0d4f5" opacity="0.6"/><circle cx="108" cy="64" r="3" fill="#d4c0f0" opacity="0.45"/></svg>geode<span>.</span></a>
            <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')">&#9776;</button>
            <div class="nav-links">
                <a href="/pt/">In&iacute;cio</a>
                <a href="/pt/metodologia.html">Metodologia</a>
                <a href="/pt/construcao.html">Diario</a>
                <a href="/pt/contato.html" class="active">Contato</a>
                <a href="/contact" style="font-size: 11px; letter-spacing: 1px;">EN</a>
                <button class="mode-toggle" onclick="toggleMode()" title="Alternar modo claro/escuro" aria-label="Alternar modo claro/escuro">&#9789;</button>
            </div>
        </div>
    </nav>

    <div class="hero" style="padding-bottom: 60px;">
        <div class="container container--narrow">
            <h1>Vamos <span>conversar.</span></h1>
            <p class="sub">Conte sobre sua organiza&ccedil;&atilde;o. Fazemos uma verifica&ccedil;&atilde;o inicial de cita&ccedil;&atilde;o e voltamos com o que encontramos.</p>
        </div>
    </div>

    <div class="page-section" style="padding-top: 0;">
        <div class="container container--narrow">
            <form id="contact-form" onsubmit="return submitForm(event)">
                <div class="form-group">
                    <label for="name">Nome</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="company">Empresa</label>
                    <input type="text" id="company" name="company" required>
                </div>
                <div class="form-group">
                    <label for="industry">Setor</label>
                    <input type="text" id="industry" name="industry" placeholder="Ex: Engenharia, Jur&iacute;dico, Ind&uacute;stria">
                </div>
                <div class="form-group">
                    <label for="message">O que sua organiza&ccedil;&atilde;o faz?</label>
                    <textarea id="message" name="message" placeholder="Descri&ccedil;&atilde;o breve da sua expertise e pelo que s&atilde;o conhecidos."></textarea>
                </div>
                <button type="submit" class="btn btn-primary" id="submit-btn">Solicitar Auditoria</button>
                <p id="form-status" style="margin-top: 16px; font-size: 13px; display: none;"></p>
            </form>
        </div>
    </div>

    <footer>
        <div class="container">
            <div class="copy">&copy; 2026 Geode | Uma empresa <a href="https://echology.io">echology</a></div>
            <div class="footer-links">
                <a href="/pt/metodologia.html">Metodologia</a>
                <a href="/pt/o-que-e-geo.html">O que é GEO</a>
                <a href="/pt/geo-vs-seo.html">GEO vs SEO</a>
                <a href="/pt/como-citacoes-ia-funcionam.html">Citações IA</a>
                <a href="/pt/construcao.html">Diario</a>
                <a href="/pt/contato.html">Contato</a>
                <a href="/">English</a>
            </div>
        </div>
    </footer>

</div>

<script>
function toggleMode() {
    document.body.classList.toggle('light');
    localStorage.setItem('mode', document.body.classList.contains('light') ? 'light' : 'dark');
}
if (localStorage.getItem('mode') === 'light') document.body.classList.add('light');

var LEADS_API = 'https://ops.aecai.io/api/leads/inbound';

function submitForm(e) {
    e.preventDefault();
    var btn = document.getElementById('submit-btn');
    var status = document.getElementById('form-status');
    btn.disabled = true;
    btn.textContent = 'Enviando...';
    status.style.display = 'none';

    var data = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        company: document.getElementById('company').value,
        industry: document.getElementById('industry').value,
        message: document.getElementById('message').value,
        source: 'geode.digital',
        language: 'pt-BR'
    };

    fetch(LEADS_API, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    })
    .then(function(r) {
        if (!r.ok) throw new Error('Erro no servidor');
        return r.json();
    })
    .then(function() {
        status.textContent = 'Recebido. Entraremos em contato.';
        status.style.color = 'var(--accent)';
        status.style.display = 'block';
        document.getElementById('contact-form').reset();
    })
    .catch(function() {
        status.innerHTML = 'N&atilde;o foi poss&iacute;vel conectar ao servidor. Envie email para <a href="mailto:kyle@geode.digital">kyle@geode.digital</a>';
        status.style.color = 'var(--amber)';
        status.style.display = 'block';
    })
    .finally(function() {
        btn.disabled = false;
        btn.textContent = 'Solicitar Auditoria';
    });

    return false;
}
</script>

</body>
</html>
