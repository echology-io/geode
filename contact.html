<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Geode</title>
    <meta name="description" content="Request a Citation Gap Audit from Geode. Find out what AI systems say about your organization and where the gaps are.">
    <meta property="og:title" content="Contact — Geode">
    <meta property="og:description" content="Request a Citation Gap Audit. Find out what AI says about your organization.">
    <meta property="og:type" content="website">
    <link rel="canonical" href="https://geodelabs.io/contact">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="content">

    <nav>
        <div class="container">
            <a href="/" class="logo">geode<span>.</span></a>
            <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')">&#9776;</button>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/methodology">Methodology</a>
                <a href="/contact" class="active">Contact</a>
                <button class="mode-toggle" onclick="toggleMode()" title="Toggle light/dark mode" aria-label="Toggle light/dark mode">&#9789;</button>
            </div>
        </div>
    </nav>

    <div class="hero" style="padding-bottom: 60px;">
        <div class="container container--narrow">
            <h1>Let's <span>talk.</span></h1>
            <p class="sub">Tell us about your organization. We'll run an initial citation check and get back to you with what we find.</p>
        </div>
    </div>

    <div class="page-section" style="padding-top: 0;">
        <div class="container container--narrow">
            <form id="contact-form" action="https://formspree.io/f/FORM_ID" method="POST">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="company">Company</label>
                    <input type="text" id="company" name="company" required>
                </div>
                <div class="form-group">
                    <label for="industry">Industry</label>
                    <input type="text" id="industry" name="industry" placeholder="e.g. Engineering, Legal, Manufacturing">
                </div>
                <div class="form-group">
                    <label for="message">What does your organization do?</label>
                    <textarea id="message" name="message" placeholder="Brief description of your expertise and what you're known for."></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Request Citation Audit</button>
            </form>
        </div>
    </div>

    <footer>
        <div class="container">
            <div class="copy">&copy; 2026 Geode</div>
            <div class="footer-links">
                <a href="/methodology">Methodology</a>
                <a href="/contact">Contact</a>
            </div>
        </div>
    </footer>

</div>

<script>
function toggleMode() {
    document.body.classList.toggle('light');
    localStorage.setItem('mode', document.body.classList.contains('light') ? 'light' : 'dark');
}
if (localStorage.getItem('mode') === 'light') document.body.classList.add('light');
</script>

</body>
</html>
